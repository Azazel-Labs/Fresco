name: Rust coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      # Keep instrumented test binaries small enough for hosted runner disks.
      # Coverage mapping is emitted by instrument-coverage without debug info.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-coverage-no-debug
          workspaces: . -> target/llvm-cov-target
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Report runner resources before coverage
        run: |
          df -h .
          free -h
          du -sh target/llvm-cov-target 2>/dev/null || true
      - name: Run instrumented workspace tests
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --workspace --locked --lcov --output-path target/coverage/lcov.info
      - name: Generate browsable report
        run: cargo llvm-cov report --html --output-dir target/coverage
      - name: Report runner resources after coverage
        if: always()
        run: |
          df -h .
          free -h
          du -sh target/llvm-cov-target 2>/dev/null || true
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: error
