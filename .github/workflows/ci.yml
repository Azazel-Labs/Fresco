name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      # Keep the many native test binaries small on hosted runners.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install coverage tooling
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install SPIR-V validator
        run: sudo apt-get update && sudo apt-get install -y spirv-tools

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-native-coverage-no-debug
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Report runner resources before native CI
        run: |
          df -h .
          free -h
          du -sh target 2>/dev/null || true

      - name: Configure native build and test concurrency
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_resources.py'
          python3 -m unittest discover -s scripts -p 'test_coverage_badge.py'
          python3 scripts/ci-resources.py --test-threads

      - name: Check README and run workspace CI with coverage
        shell: bash
        run: |
          # Instrument the existing gate; its workspace tests run only once.
          # Keep normal cfg behavior so coverage cannot disable tests or code.
          coverage_env="$(cargo llvm-cov show-env --sh --no-cfg-coverage)"
          eval "$coverage_env"
          cargo llvm-cov clean --workspace

          # Check before ci-strict synchronizes README snippets in the checkout.
          cargo run --locked -p xtask -- readme-sync --check
          cargo run --locked -p xtask -- ci-strict

          # Report commands reuse the collected profiles without rerunning tests.
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --html --output-dir target/coverage
          cargo llvm-cov report --json --summary-only --output-path target/coverage/summary.json
          python3 scripts/coverage_badge.py target/coverage/summary.json target/coverage/badge.svg

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: error

      - name: Report runner resources after native CI
        if: always()
        run: |
          df -h .
          free -h
          du -sh target 2>/dev/null || true

  web-playground:
    needs: [ci, dependency-policy]
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure web build concurrency
        run: python3 scripts/ci-resources.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-web
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/fresco-wasm/web/package-lock.json

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Check release version consistency
        run: node --test scripts/version.test.mjs

      - name: Install web dependencies
        working-directory: crates/fresco-wasm/web
        run: npm ci

      - name: Check generated wasm contracts drift
        working-directory: crates/fresco-wasm/web
        run: npm run types:contracts:check

      - name: Check WASM-specific Rust code
        run: cargo clippy -p fresco-wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Check browser renderer Rust code
        run: cargo clippy -p fresco-example-engine-host --target wasm32-unknown-unknown --no-default-features --features browser --locked -- -D warnings

      - name: Build release compiler and example renderer WASM bundles
        working-directory: crates/fresco-wasm/web
        run: npm run wasm:build

      - name: Build deployable web bundle using the existing WASM
        working-directory: crates/fresco-wasm/web
        env:
          FRESCO_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:site

      - name: Run web typecheck
        working-directory: crates/fresco-wasm/web
        run: npm run typecheck

      - name: Run web unit tests
        working-directory: crates/fresco-wasm/web
        run: npm run test:unit

      - name: Check sample path comparison boundaries (CPU only)
        run: node --test integrations/example-engine-host/scripts/path-pixels.test.mjs

      - name: Include coverage badge and report in Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: rust-coverage
          path: crates/fresco-wasm/web/dist/coverage

      - name: Upload tested site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/fresco-wasm/web/dist

  deploy-pages:
    needs: web-playground
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy tested playground to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependency-policy
          cache-targets: false
          cache-on-failure: true

      - name: Run cargo-deny checks
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  unused-dependencies:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (nightly for udeps)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache nightly cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-nightly-udeps
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cargo-udeps

      - name: Run cargo-udeps
        run: cargo +nightly udeps --workspace --all-targets

  # Cargo.toml's [workspace.package] version is the one source of truth for releases: when everything above passes on
  # a push to main whose version no vX.Y.Z tag has yet, that commit is tagged with it and a GitHub release is made.
  # Raise it with node scripts/version.mjs patch|minor|major and push. An already-tagged version releases nothing; one behind the newest tag fails.
  release:
    needs: [ci, web-playground, dependency-policy, unused-dependencies]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, never cancelled mid-release. A newer push's run waits, then sees the newer main.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      # The version Fresco started at, which was never released: the first release is the first version after it.
      UNRELEASED: 0.2.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Plan
        id: plan
        run: |
          # Only act on main's tip: if main has moved on, the newer push's run gets here too.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA; skipping"
            exit 0
          fi
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml's [workspace.package] version, '$version', isn't X.Y.Z"; exit 1
          fi
          if [ "$version" = "$UNRELEASED" ]; then
            echo "$version is the version Fresco started at; raise it to release"
            exit 0
          fi
          # A version behind the newest release is a mistake (pre-releases of the newest X.Y.Z are fine).
          newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          newest="${newest#v}"; newest="${newest%%-*}"
          if [ -n "$newest" ] && [ "$newest" != "${version%%-*}" ] &&
             [ "$(printf '%s\n%s\n' "$newest" "${version%%-*}" | sort -V | tail -1)" = "$newest" ]; then
            echo "::error::Cargo.toml says $version, behind the newest release, v$newest. Raise it with node scripts/version.mjs patch|minor|major."
            exit 1
          fi
          if [[ "$version" == *-* ]] && git rev-parse -q --verify "refs/tags/v${version%%-*}" >/dev/null; then
            echo "::error::Cargo.toml says $version, a pre-release of v${version%%-*}, which is already out."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do"
            exit 0
          fi
          echo "Releasing v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag and create the GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          # Whoever pushed the commit, by their GitHub noreply address, so the version shows as theirs on GitHub
          # without their email in the tag.
          RELEASER: ${{ github.actor }}
          RELEASER_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$RELEASER"
          git config user.email "$RELEASER_ID+$RELEASER@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Fresco $VERSION"
          git push origin "refs/tags/v$VERSION"
          prerelease=""; [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "v$VERSION" --verify-tag --title "Fresco $VERSION" --generate-notes $prerelease
