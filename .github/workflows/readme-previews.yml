name: Previews

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/readme/**'
      - 'examples/**'
      - 'crates/**'
      - 'xtask/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/readme-previews.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/readme/**'
      - 'examples/**'
      - 'crates/**'
      - 'xtask/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/readme-previews.yml'

permissions:
  contents: read

jobs:
  validate:
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-previews
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Check README snippets and compile sample programs
        run: cargo xtask readme-sync --check
