name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-copilot
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/fresco-wasm/web/package-lock.json

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install web dependencies
        working-directory: crates/fresco-wasm/web
        run: npm ci

      - name: Install git hooks
        run: cargo xtask install-hooks

      - name: Warm cargo build cache
        run: cargo check --workspace
