name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/fresco-wasm/web/package-lock.json

      - name: Setup Rust
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust compiler outputs
        if: github.event_name == 'workflow_dispatch'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and target
        if: github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-pages-manual
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install wasm-pack
        if: github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@wasm-pack

      - name: Install web dependencies
        if: github.event_name == 'workflow_dispatch'
        working-directory: crates/fresco-wasm/web
        run: npm ci

      - name: Build web bundle
        if: github.event_name == 'workflow_dispatch'
        working-directory: crates/fresco-wasm/web
        env:
          FRESCO_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Download site from the successful CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: fresco-pages-${{ github.event.workflow_run.head_sha }}
          path: crates/fresco-wasm/web/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: crates/fresco-wasm/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
