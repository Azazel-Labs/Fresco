[package]
repository.workspace = true
name = "fresco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fresco compiler core library."
license = "MIT-0"

[dependencies]
fresco-artifact = { workspace = true, features = ["naga"] }
fresco-macros.workspace = true
bitflags = "2.13.0"
inventory = "0.3"
logos = "0.16.1"
chumsky = "0.13.0"
ariadne = "0.6.0"
naga = { version = "30.0.0", features = ["wgsl-in", "wgsl-out"] }
web-time = "1.1.0"
smol_str = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-chrome = { version = "0.7", optional = true }
tracing-tracy = { version = "0.11", optional = true }
roxmltree = "0.21"
svgtypes = "0.16"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1.24"

[features]
default = []
trace-chrome = ["dep:tracing-chrome"]
trace-tracy = ["dep:tracing-tracy"]

[lints]
workspace = true
