[package]
repository.workspace = true
name = "fresco-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WASM bindings scaffold for the Fresco compiler."
license = "MIT-0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fresco-example-engine.workspace = true
fresco.workspace = true
fresco-artifact = { workspace = true, features = ["typescript"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[lints]
workspace = true
