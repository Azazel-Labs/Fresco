[package]
repository.workspace = true
name = "fresco-artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared Fresco compiler artifact contracts."
license = "MIT-0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"], optional = true }
naga = { version = "30.0.0", default-features = false, optional = true }

[features]
default = []
typescript = ["dep:ts-rs"]
naga = ["dep:naga"]

[lints]
workspace = true
