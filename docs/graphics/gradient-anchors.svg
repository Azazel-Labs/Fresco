<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">Where does the gradient live?</title><desc id="description">Scene-anchored shapes sample portions of one shared gradient ruler. Shape-anchored shapes each span the full pink-to-blue gradient. Scene means the active space, not necessarily fixed screen coordinates.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >Where does the gradient live?</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Matching geometry, different coordinate ownership.</text>
    <text x="36" y="194" font-size="23" fill="#63caff" font-weight="650" >anchor: scene</text><text x="36" y="225" font-size="16" fill="#adbad0" font-weight="400" >A shared ruler in the active space</text><rect x="372" y="174" width="682" height="12" rx="2" fill="url(#paint)" stroke="none" /><text x="372" y="165" font-size="15" fill="#adbad0" font-weight="400" >0</text><text x="1054" y="165" font-size="15" fill="#adbad0" font-weight="400" text-anchor="end">1</text><rect x="395" y="217" width="140" height="80" rx="20" fill="url(#scene-paint)" stroke="none" id="gradient-0-0"/><rect x="610" y="217" width="210" height="80" rx="20" fill="url(#scene-paint)" stroke="none" id="gradient-0-1"/><rect x="903" y="217" width="110" height="80" rx="20" fill="url(#scene-paint)" stroke="none" id="gradient-0-2"/><text x="36" y="389" font-size="23" fill="#ff4b91" font-weight="650" >anchor: shape</text><text x="36" y="420" font-size="16" fill="#adbad0" font-weight="400" >A full gradient for each receiver</text><rect x="395" y="412" width="140" height="80" rx="20" fill="url(#paint)" stroke="none" id="gradient-1-0"/><g id="shape-ruler-0"><rect x="395" y="369" width="140" height="12" rx="2" fill="url(#paint)" stroke="none" /><text x="395" y="360" font-size="15" fill="#adbad0" font-weight="400" >0</text><text x="535" y="360" font-size="15" fill="#adbad0" font-weight="400" text-anchor="end">1</text></g><rect x="610" y="412" width="210" height="80" rx="20" fill="url(#paint)" stroke="none" id="gradient-1-1"/><g id="shape-ruler-1"><rect x="610" y="369" width="210" height="12" rx="2" fill="url(#paint)" stroke="none" /><text x="610" y="360" font-size="15" fill="#adbad0" font-weight="400" >0</text><text x="820" y="360" font-size="15" fill="#adbad0" font-weight="400" text-anchor="end">1</text></g><rect x="903" y="412" width="110" height="80" rx="20" fill="url(#paint)" stroke="none" id="gradient-1-2"/><g id="shape-ruler-2"><rect x="903" y="369" width="110" height="12" rx="2" fill="url(#paint)" stroke="none" /><text x="903" y="360" font-size="15" fill="#adbad0" font-weight="400" >0</text><text x="1013" y="360" font-size="15" fill="#adbad0" font-weight="400" text-anchor="end">1</text></g><defs><linearGradient id="scene-paint" gradientUnits="userSpaceOnUse" x1="372" x2="1054"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient></defs><text x="36" y="551" font-size="21" fill="#edf3ff" font-weight="400" >Scene follows the active space. Shape anchoring requires a supported owning shape.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
