<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">The pixel travels backward</title><desc id="description">The authored rounded box is rotated counterclockwise. To shade a fixed output sample, undo the rotation and evaluate the original field at that mapped coordinate. The yellow point shows the corresponding lookup.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >The pixel travels backward</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Content moves forward through a transform; sample lookup uses its inverse.</text>
    <rect x="60" y="178" width="360" height="320" rx="8" fill="#0c1627" stroke="#2b3c55" /><path d="M100,178 L100,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M140,178 L140,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M180,178 L180,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M220,178 L220,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M260,178 L260,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M300,178 L300,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M340,178 L340,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M380,178 L380,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M60,218 L420,218" fill="none" stroke="#203047" stroke-width="1"/><path d="M60,258 L420,258" fill="none" stroke="#203047" stroke-width="1"/><path d="M60,298 L420,298" fill="none" stroke="#203047" stroke-width="1"/><path d="M60,338 L420,338" fill="none" stroke="#203047" stroke-width="1"/><path d="M60,378 L420,378" fill="none" stroke="#203047" stroke-width="1"/><path d="M60,418 L420,418" fill="none" stroke="#203047" stroke-width="1"/><path d="M60,458 L420,458" fill="none" stroke="#203047" stroke-width="1"/><rect x="700" y="178" width="360" height="320" rx="8" fill="#0c1627" stroke="#2b3c55" /><path d="M740,178 L740,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M780,178 L780,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M820,178 L820,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M860,178 L860,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M900,178 L900,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M940,178 L940,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M980,178 L980,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M1020,178 L1020,498" fill="none" stroke="#203047" stroke-width="1"/><path d="M700,218 L1060,218" fill="none" stroke="#203047" stroke-width="1"/><path d="M700,258 L1060,258" fill="none" stroke="#203047" stroke-width="1"/><path d="M700,298 L1060,298" fill="none" stroke="#203047" stroke-width="1"/><path d="M700,338 L1060,338" fill="none" stroke="#203047" stroke-width="1"/><path d="M700,378 L1060,378" fill="none" stroke="#203047" stroke-width="1"/><path d="M700,418 L1060,418" fill="none" stroke="#203047" stroke-width="1"/><path d="M700,458 L1060,458" fill="none" stroke="#203047" stroke-width="1"/><text x="60" y="157" font-size="22" fill="#73e2bf" font-weight="650" >Original field</text><text x="700" y="157" font-size="22" fill="#ff4b91" font-weight="650" >Output picture</text><rect x="150" y="278" width="180" height="120" rx="16" fill="#16392f" stroke="#73e2bf" /><g id="inverse-shape" transform="rotate(-30 880 338)"><rect x="790" y="278" width="180" height="120" rx="16" fill="#733251" stroke="#ff4b91" /></g><circle cx="940" cy="308" r="7" fill="#ffc875"/><text x="934" y="286" font-size="17" fill="#ffc875" font-weight="400" text-anchor="end">output sample</text><circle id="inverse-point" cx="307" cy="342" r="7" fill="#ffc875"/><path d="M452,239 L668,239" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="215" font-size="20" fill="#ff4b91" font-weight="400" text-anchor="middle" id="inverse-label">Author: rotate +30°</text><path d="M668,402 L452,402" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="439" font-size="19" fill="#63caff" font-weight="400" text-anchor="middle">Sample: undo rotation</text><text x="60" y="546" font-size="22" fill="#edf3ff" font-weight="400" >For each output pixel, map its coordinate back before evaluating the original field.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
