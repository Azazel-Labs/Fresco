<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title description">
    <title id="title">Spaces compound—and order matters</title><desc id="description">Compare an outer translation with inner scale against outer scale with inner translation. Both use a circle at x 0.65, radius 0.12, shift 0.12, and scale 0.6 around the center. Centers become 0.710 and 0.662. Sample mapping undoes scopes from outer to inner.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="740" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >Spaces compound—and order matters</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Identical circle, identical transforms, different nesting.</text>
    <text x="36" y="158" font-size="23" fill="#73e2bf" font-weight="650" >Translate outside scale</text><text x="36" y="190" font-size="19" fill="#adbad0" font-weight="400" >translate { scale { shape } }</text><rect x="36" y="210" width="496" height="280" rx="8" fill="#0c1627" stroke="#2b3c55" /><path d="M76,210 L76,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M116,210 L116,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M156,210 L156,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M196,210 L196,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M236,210 L236,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M276,210 L276,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M316,210 L316,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M356,210 L356,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M396,210 L396,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M436,210 L436,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M476,210 L476,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M516,210 L516,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M36,250 L532,250" fill="none" stroke="#203047" stroke-width="1"/><path d="M36,290 L532,290" fill="none" stroke="#203047" stroke-width="1"/><path d="M36,330 L532,330" fill="none" stroke="#203047" stroke-width="1"/><path d="M36,370 L532,370" fill="none" stroke="#203047" stroke-width="1"/><path d="M36,410 L532,410" fill="none" stroke="#203047" stroke-width="1"/><path d="M36,450 L532,450" fill="none" stroke="#203047" stroke-width="1"/><path d="M36,350 L532,350" fill="none" stroke="#53708a" stroke-width="1"/><path d="M284,210 L284,490" fill="none" stroke="#53708a" stroke-width="1"/><circle cx="358.40000000000003" cy="350" r="59.519999999999996" fill="none" stroke="#adbad0" stroke-dasharray="5 5"/><circle id="compound-a" cx="388.15999999999997" cy="350" r="35.711999999999996" fill="#73e2bf" fill-opacity=".65"/><text x="54" y="246" font-size="17" fill="#adbad0" font-weight="400" >Dashed: original circle</text><text x="54" y="469" font-size="20" fill="#edf3ff" font-weight="400" id="compound-label-a">Output center x = 0.710</text><text x="588" y="158" font-size="23" fill="#ff4b91" font-weight="650" >Scale outside translate</text><text x="588" y="190" font-size="19" fill="#adbad0" font-weight="400" >scale { translate { shape } }</text><rect x="588" y="210" width="496" height="280" rx="8" fill="#0c1627" stroke="#2b3c55" /><path d="M628,210 L628,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M668,210 L668,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M708,210 L708,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M748,210 L748,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M788,210 L788,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M828,210 L828,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M868,210 L868,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M908,210 L908,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M948,210 L948,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M988,210 L988,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M1028,210 L1028,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M1068,210 L1068,490" fill="none" stroke="#203047" stroke-width="1"/><path d="M588,250 L1084,250" fill="none" stroke="#203047" stroke-width="1"/><path d="M588,290 L1084,290" fill="none" stroke="#203047" stroke-width="1"/><path d="M588,330 L1084,330" fill="none" stroke="#203047" stroke-width="1"/><path d="M588,370 L1084,370" fill="none" stroke="#203047" stroke-width="1"/><path d="M588,410 L1084,410" fill="none" stroke="#203047" stroke-width="1"/><path d="M588,450 L1084,450" fill="none" stroke="#203047" stroke-width="1"/><path d="M588,350 L1084,350" fill="none" stroke="#53708a" stroke-width="1"/><path d="M836,210 L836,490" fill="none" stroke="#53708a" stroke-width="1"/><circle cx="910.4000000000001" cy="350" r="59.519999999999996" fill="none" stroke="#adbad0" stroke-dasharray="5 5"/><circle id="compound-b" cx="916.3520000000001" cy="350" r="35.711999999999996" fill="#ff4b91" fill-opacity=".65"/><text x="606" y="246" font-size="17" fill="#adbad0" font-weight="400" >Dashed: original circle</text><text x="606" y="469" font-size="20" fill="#edf3ff" font-weight="400" id="compound-label-b">Output center x = 0.662</text><text x="36" y="536" font-size="22" fill="#63caff" font-weight="650" >Pixel lookup: undo outer, then inner</text><text x="36" y="574" font-size="20" fill="#73e2bf" font-weight="400" >q = center + (p - shift - center) / scale</text><text x="588" y="574" font-size="20" fill="#ff4b91" font-weight="400" >q = center + (p - center) / scale - shift</text><text x="36" y="622" font-size="20" fill="#adbad0" font-weight="400" id="compound-settings">Shift = (0.12, 0); scale = 0.60 around center. Both scopes affect all content inside.</text><text x="36" y="660" font-size="23" fill="#edf3ff" font-weight="400" >Swapping scopes changes whether the translation itself is scaled.</text>
    <path d="M36,697 L1084,697" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="721" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="721" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
