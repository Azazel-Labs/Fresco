<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title description">
    <title id="title">From visual intent to your renderer</title><desc id="description">Authored content and engine declarations enter Fresco. It produces paired WGSL and execution metadata. A host validates resources and runs the work. Rust/wgpu is the working reference; Godot and Unreal are potential integration targets requiring adapters.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="810" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >From visual intent to your renderer</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Fresco compiles authored behavior. Your engine supplies the world and executes the result.</text>
    <rect x="36" y="155" width="300" height="192" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="155" width="4" height="192" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="56" y="189" font-size="22" fill="#73e2bf" font-weight="650" >01 / Author intent</text><text x="56" y="222" font-size="18" fill="#adbad0" font-weight="400" >Shapes, layers, spaces</text><text x="56" y="249" font-size="18" fill="#adbad0" font-weight="400" >Materials and styles</text><text x="56" y="276" font-size="18" fill="#adbad0" font-weight="400" >Engine contracts + operations</text><rect x="410" y="155" width="300" height="192" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="410" y="155" width="4" height="192" rx="2" fill="#ff4b91" stroke="#ff4b91" /><text x="430" y="189" font-size="22" fill="#ff4b91" font-weight="650" >02 / Compile together</text><text x="430" y="222" font-size="18" fill="#adbad0" font-weight="400" >Check contracts + specialize</text><text x="430" y="249" font-size="18" fill="#adbad0" font-weight="400" >Rewrite supported patterns</text><text x="430" y="276" font-size="18" fill="#adbad0" font-weight="400" >Lower shaders + plan work</text><rect x="784" y="155" width="300" height="192" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="784" y="155" width="4" height="192" rx="2" fill="#63caff" stroke="#63caff" /><text x="804" y="189" font-size="22" fill="#63caff" font-weight="650" >03 / Run in your engine</text><text x="804" y="222" font-size="18" fill="#adbad0" font-weight="400" >Validate + bind resources</text><text x="804" y="249" font-size="18" fill="#adbad0" font-weight="400" >Create pipelines + allocate</text><text x="804" y="276" font-size="18" fill="#adbad0" font-weight="400" >Submit GPU work + present</text><path d="M342,249 L402,249" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M716,249 L776,249" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="373" width="300" height="108" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="410" y="373" width="4" height="108" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="430" y="407" font-size="22" fill="#ffc875" font-weight="650" >Paired output</text><text x="430" y="440" font-size="18" fill="#adbad0" font-weight="400" >WGSL + execution metadata</text><path d="M560,347 L560,368" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 425 H934 V354" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="392" font-size="20" fill="#73e2bf" font-weight="650" >Engine-authored contract</text><text x="36" y="422" font-size="18" fill="#adbad0" font-weight="400" >Defines inputs, capabilities,</text><text x="36" y="450" font-size="18" fill="#adbad0" font-weight="400" >and rendering boundaries.</text><text x="784" y="510" font-size="20" fill="#63caff" font-weight="650" >Adapter / provider boundary</text><text x="784" y="539" font-size="17" fill="#adbad0" font-weight="400" >Host data + backend integration</text><rect x="36" y="582" width="330" height="112" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="582" width="4" height="112" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="56" y="616" font-size="22" fill="#73e2bf" font-weight="650" >Working reference</text><text x="56" y="649" font-size="18" fill="#adbad0" font-weight="400" >Bundled Rust / wgpu engine</text><text x="56" y="676" font-size="18" fill="#adbad0" font-weight="400" >Native + browser hosts</text><rect x="390" y="582" width="330" height="112" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="390" y="582" width="4" height="112" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="410" y="616" font-size="22" fill="#ffc875" font-weight="650" >Potential target: Godot</text><text x="410" y="649" font-size="18" fill="#adbad0" font-weight="400" >Adapter + backend work needed</text><text x="410" y="676" font-size="18" fill="#adbad0" font-weight="400" >No ready-made plugin implied</text><rect x="744" y="582" width="340" height="112" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="744" y="582" width="4" height="112" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="764" y="616" font-size="22" fill="#ffc875" font-weight="650" >Potential target: Unreal</text><text x="764" y="649" font-size="18" fill="#adbad0" font-weight="400" >Or your own engine / renderer</text><text x="764" y="676" font-size="18" fill="#adbad0" font-weight="400" >Adapter + backend work needed</text><text x="36" y="738" font-size="19" fill="#edf3ff" font-weight="400" >Shader output and host execution must agree on bindings, resources, stages, and lifetime.</text>
    <path d="M36,767 L1084,767" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="791" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="791" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
