<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">One shape. Three treatments. One picture.</title><desc id="description">One rounded-box field feeds shadow, fill, and stroke followed by fill. The layers are shown exploded: shadow below pink fill below white outline. Later composition entries appear above earlier ones.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >One shape. Three treatments. One picture.</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Follow the badge from a distance field to painted layers.</text>
    <rect x="36" y="152" width="240" height="353" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="152" width="4" height="353" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="56" y="186" font-size="22" fill="#73e2bf" font-weight="650" >One shape</text><rect x="71.0" y="253.0" width="170" height="130" rx="32.0" fill="none" stroke="#315c56" /><rect x="77.0" y="259.0" width="158" height="118" rx="28.0" fill="none" stroke="#315c56" /><rect x="83.0" y="265.0" width="146" height="106" rx="24.0" fill="none" stroke="#315c56" /><rect x="89.0" y="271.0" width="134" height="94" rx="20.0" fill="none" stroke="#73e2bf" /><text x="60" y="441" font-size="20" fill="#73e2bf" font-weight="400" >Rounded-box field</text><text x="60" y="474" font-size="16" fill="#adbad0" font-weight="400" >Geometry stays reusable.</text><path d="M276 326 H300 V211 H326" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M276 326 H300 V325 H326" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M276 326 H300 V439 H326" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="332" y="165" width="260" height="92" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="332" y="165" width="4" height="92" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="352" y="199" font-size="22" fill="#ffc875" font-weight="650" >Shadow</text><text x="352" y="232" font-size="18" fill="#adbad0" font-weight="400" >Offset + soft coverage</text><rect x="332" y="279" width="260" height="92" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="332" y="279" width="4" height="92" rx="2" fill="#ff4b91" stroke="#ff4b91" /><text x="352" y="313" font-size="22" fill="#ff4b91" font-weight="650" >Fill</text><text x="352" y="346" font-size="18" fill="#adbad0" font-weight="400" >Paint the interior</text><rect x="332" y="393" width="260" height="92" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="332" y="393" width="4" height="92" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="352" y="427" font-size="22" fill="#73e2bf" font-weight="650" >Stroke → fill</text><text x="352" y="460" font-size="18" fill="#adbad0" font-weight="400" >Outline shape → paint</text><text x="663" y="177" font-size="23" fill="#edf3ff" font-weight="650" >Source order → final picture</text><g id="badge-shadow" transform="translate(0 45)"><rect x="745" y="279" width="200" height="140" rx="28" fill="#000000" stroke="#243249" /></g><g id="badge-fill" transform="translate(0 0)"><rect x="733" y="267" width="200" height="140" rx="28" fill="#ff4b91" stroke="#ff4b91" /></g><g id="badge-stroke" transform="translate(0 -45)"><rect x="733" y="267" width="200" height="140" rx="28" fill="none" stroke="#edf3ff" stroke-width="4"/></g><text x="687" y="510" font-size="18" fill="#adbad0" font-weight="400" >Exploded layers; later entries on top.</text><text x="36" y="552" font-size="22" fill="#edf3ff" font-weight="400" >A shape is geometry. Filling it produces a layer that can be composed.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
