<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title description">
    <title id="title">From a picture description to shader math</title><desc id="description">Five source-to-evaluation correspondences: translate subtracts an offset, scale divides coordinates around a pivot, circle evaluates signed distance, fill converts distance to coverage, and composition blends foreground and background. This is explanatory pseudocode, not literal emitted WGSL. The companion Fresco sample can be compiled to inspect actual output.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="840" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >From a picture description to shader math</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Read top to bottom: nested scopes become coordinates; geometry becomes numbers; paint becomes color.</text>
    <text x="36" y="154" font-size="15" fill="#73e2bf" font-weight="700" >AUTHORED FRESCO</text><text x="524" y="154" font-size="15" fill="#63caff" font-weight="700" >PER-SAMPLE EVALUATION</text><rect x="36" y="174" width="426" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="50" y="210" font-size="18" fill="#63caff" font-weight="600" >in space translate((0.12, 0))</text><path d="M472,214 L512,214" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="524" y="174" width="560" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="540" y="207" font-size="20" fill="#63caff" font-weight="600" >p1 = p - vec2(0.12, 0)</text><text x="540" y="236" font-size="17" fill="#adbad0" font-weight="400" >Undo the outer translation.</text><rect x="36" y="279" width="426" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="50" y="315" font-size="18" fill="#63caff" font-weight="600" >in space scale(0.6, around: center)</text><path d="M472,319 L512,319" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="524" y="279" width="560" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="540" y="312" font-size="20" fill="#63caff" font-weight="600" >q = center + (p1 - center) / 0.6</text><text x="540" y="341" font-size="17" fill="#adbad0" font-weight="400" >Undo the inner scale around its pivot.</text><rect x="36" y="384" width="426" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="50" y="420" font-size="18" fill="#73e2bf" font-weight="600" >circle(at: (0.65, 0.5), radius: 0.12)</text><path d="M472,424 L512,424" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="524" y="384" width="560" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="540" y="417" font-size="20" fill="#73e2bf" font-weight="600" >d = length(q - vec2(0.65, 0.5)) - 0.12</text><text x="540" y="446" font-size="17" fill="#adbad0" font-weight="400" >Evaluate the distance at that coordinate.</text><rect x="36" y="489" width="426" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="50" y="525" font-size="18" fill="#ff4b91" font-weight="600" >|&gt; fill(#ff4b91)</text><path d="M472,529 L512,529" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="524" y="489" width="560" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="540" y="522" font-size="20" fill="#ff4b91" font-weight="600" >a = clamp(0.5 - d / aa_width, 0, 1)</text><text x="540" y="551" font-size="17" fill="#adbad0" font-weight="400" >Convert distance into filtered coverage.</text><rect x="36" y="594" width="426" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="50" y="630" font-size="18" fill="#ffc875" font-weight="600" >compose { background; circle_layer }</text><path d="M472,634 L512,634" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="524" y="594" width="560" height="86" rx="16" fill="#131f33" stroke="#2b3c55" /><text x="540" y="627" font-size="20" fill="#ffc875" font-weight="600" >rgb = mix(background, ink, a)</text><text x="540" y="656" font-size="17" fill="#adbad0" font-weight="400" >Blend over the opaque background.</text><text x="36" y="733" font-size="21" fill="#edf3ff" font-weight="400" >One fragment invocation follows this chain for its sample and returns an RGBA value.</text><text x="36" y="769" font-size="18" fill="#adbad0" font-weight="400" >Simplified pseudocode: generated WGSL includes context, scale guards, AA policy, and stage wrappers.</text>
    <path d="M36,797 L1084,797" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="821" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="821" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
