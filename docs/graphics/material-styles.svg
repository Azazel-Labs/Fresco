<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">A style can change more than the lighting</title><desc id="description">A smooth PBR sphere symbolizes base shading. Toon uses banded shading and an expanded outline hull. Fur uses a root surface plus density-controlled generated shells. These are conceptual drawings, not rendered output comparisons.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >A style can change more than the lighting</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Schematic cross-sections expose the work behind a material’s appearance.</text>
    <rect x="36" y="155" width="328" height="364" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="155" width="4" height="364" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="56" y="189" font-size="22" fill="#ffc875" font-weight="650" >PBR response</text><text x="56" y="445" font-size="18" fill="#adbad0" font-weight="400" >Surface inputs + lighting</text><text x="56" y="473" font-size="18" fill="#adbad0" font-weight="400" >→ shaded base surface</text><rect x="396" y="155" width="328" height="364" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="396" y="155" width="4" height="364" rx="2" fill="#ff4b91" stroke="#ff4b91" /><text x="416" y="189" font-size="22" fill="#ff4b91" font-weight="650" >Toon + outline</text><text x="416" y="445" font-size="18" fill="#adbad0" font-weight="400" >Banded light response</text><text x="416" y="473" font-size="18" fill="#adbad0" font-weight="400" >+ expanded hull draw</text><rect x="756" y="155" width="328" height="364" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="756" y="155" width="4" height="364" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="776" y="189" font-size="22" fill="#73e2bf" font-weight="650" >Fur + generated shells</text><text x="776" y="445" font-size="18" fill="#adbad0" font-weight="400" >Density + generated vertices</text><text x="776" y="473" font-size="18" fill="#adbad0" font-weight="400" >+ translucent shell draws</text><circle cx="200" cy="302" r="83" fill="url(#orb)"/><circle cx="560" cy="302" r="91" fill="#ff4b91"/><defs><clipPath id="toon"><circle cx="560" cy="302" r="80"/></clipPath></defs><g clip-path="url(#toon)"><rect x="475" y="217" width="170" height="170" rx="0" fill="#753950" stroke="none" /><path d="M475 217 H645 L581 387 H475Z" fill="#f0a276" stroke="#f0a276" stroke-width="0" /><path d="M475 217 H575 L510 340 H475Z" fill="#ffdfab" stroke="#ffdfab" stroke-width="0" /></g><circle cx="920" cy="302" r="61" fill="url(#orb)"/><circle cx="920" cy="302" r="70" fill="none" stroke="#73e2bf" stroke-width="4" stroke-dasharray="4 5" stroke-opacity="0.53"/><circle cx="920" cy="302" r="80" fill="none" stroke="#73e2bf" stroke-width="4" stroke-dasharray="4 5" stroke-opacity="0.47"/><circle cx="920" cy="302" r="90" fill="none" stroke="#73e2bf" stroke-width="4" stroke-dasharray="4 5" stroke-opacity="0.40"/><circle cx="920" cy="302" r="100" fill="none" stroke="#73e2bf" stroke-width="4" stroke-dasharray="4 5" stroke-opacity="0.33"/><text x="36" y="552" font-size="21" fill="#edf3ff" font-weight="400" >A style supplies shading hooks and can invoke operations through the engine contract.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
