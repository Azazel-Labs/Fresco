<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">Where Toon joins your frame</title><desc id="description">The engine supplies prepared geometry, view and lighting, and typed color/depth attachments. Toon base shading participates in opaque rendering. After complete opaque rendering, its outline tests depth without writing it and preserves color. Transparency and presentation follow. Key dependencies only.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >Where Toon joins your frame</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >The engine provides the contract. The style contributes work at an explicit integration point.</text>
    <text x="36" y="159" font-size="14" fill="#ffc875" font-weight="700" >ENGINE INPUTS</text><rect x="36" y="180" width="300" height="110" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="180" width="4" height="110" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="56" y="214" font-size="22" fill="#73e2bf" font-weight="650" >Prepared geometry</text><text x="56" y="247" font-size="18" fill="#adbad0" font-weight="400" >Selected object / material range</text><rect x="408" y="180" width="300" height="110" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="408" y="180" width="4" height="110" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="428" y="214" font-size="22" fill="#ffc875" font-weight="650" >View + lighting</text><text x="428" y="247" font-size="18" fill="#adbad0" font-weight="400" >Camera, lights, scene resources</text><rect x="780" y="180" width="304" height="110" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="780" y="180" width="4" height="110" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="800" y="214" font-size="22" fill="#ffc875" font-weight="650" >Color + depth</text><text x="800" y="247" font-size="18" fill="#adbad0" font-weight="400" >Typed attachments + access</text><text x="36" y="346" font-size="14" fill="#63caff" font-weight="700" >FRAME ORDER</text><rect x="36" y="369" width="250" height="139" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="369" width="4" height="139" rx="2" fill="#63caff" stroke="#63caff" /><text x="56" y="403" font-size="22" fill="#63caff" font-weight="650" >Opaque rendering</text><text x="56" y="436" font-size="18" fill="#adbad0" font-weight="400" >Toon shades its surface</text><text x="56" y="463" font-size="18" fill="#adbad0" font-weight="400" >alongside other objects.</text><rect x="322" y="369" width="258" height="139" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="322" y="369" width="4" height="139" rx="2" fill="#ff4b91" stroke="#ff4b91" /><text x="342" y="403" font-size="22" fill="#ff4b91" font-weight="650" >after_opaque</text><text x="342" y="436" font-size="18" fill="#adbad0" font-weight="400" >Style invokes its outline.</text><text x="342" y="463" font-size="18" fill="#adbad0" font-weight="400" >Preserve color; test depth.</text><rect x="616" y="369" width="232" height="139" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="616" y="369" width="4" height="139" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="636" y="403" font-size="22" fill="#ffc875" font-weight="650" >Transparency</text><text x="636" y="436" font-size="18" fill="#adbad0" font-weight="400" >All transparent draws</text><text x="636" y="463" font-size="18" fill="#adbad0" font-weight="400" >join the global queue.</text><rect x="884" y="369" width="200" height="139" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="884" y="369" width="4" height="139" rx="2" fill="#63caff" stroke="#63caff" /><text x="904" y="403" font-size="22" fill="#63caff" font-weight="650" >Present</text><text x="904" y="436" font-size="18" fill="#adbad0" font-weight="400" >Inspect + display</text><text x="904" y="463" font-size="18" fill="#adbad0" font-weight="400" >the final color.</text><path d="M286,437 L316,437" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M580,437 L610,437" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M848,437 L878,437" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M186 290 V318 H452 V363" fill="none" stroke="#73e2bf" stroke-width="2" marker-end="url(#arrow)"/><path d="M558 290 V336 H161 V363" fill="none" stroke="#ffc875" stroke-width="2" marker-end="url(#arrow)"/><path d="M932 290 V318 H490 V363" fill="none" stroke="#ffc875" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="550" font-size="21" fill="#edf3ff" font-weight="400" >The boundary follows complete opaque rendering for the view, not just this object’s draw.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
