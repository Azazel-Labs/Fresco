<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">Who owns this pixel?</title><desc id="description">Six Voronoi regions each clip a glowing stripe to one owner. Scatter circles overlap instead. A magnified screen pixel has sixteen sample locations spanning two owners; each location reevaluates mapping, owner, and body. Finite grids are approximate.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >Who owns this pixel?</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Ownership boundaries and sampling footprints are part of the picture.</text>
    <text x="36" y="161" font-size="22" fill="#73e2bf" font-weight="650" >Cells: one owner per sample</text><defs><clipPath id="cell-0"><polygon points="36.00,181.00 166.53,181.00 193.38,302.71 36.00,343.43"/></clipPath></defs><polygon points="36.00,181.00 166.53,181.00 193.38,302.71 36.00,343.43" fill="#153d42" stroke="#73e2bf" stroke-width="1.5"/><g clip-path="url(#cell-0)"><circle cx="110" cy="248" r="94" fill="url(#haze)"/><path d="M40,270 L215,270" fill="none" stroke="#ff4b91" stroke-width="14"/></g><circle cx="110" cy="248" r="5" fill="#73e2bf"/><text x="119" y="239" font-size="15" fill="#edf3ff" font-weight="400" >ID 0</text><defs><clipPath id="cell-1"><polygon points="166.53,181.00 329.60,181.00 287.71,300.96 224.43,320.49 193.38,302.71"/></clipPath></defs><polygon points="166.53,181.00 329.60,181.00 287.71,300.96 224.43,320.49 193.38,302.71" fill="#2d2447" stroke="#73e2bf" stroke-width="1.5"/><g clip-path="url(#cell-1)"><circle cx="246" cy="218" r="94" fill="url(#haze)"/><path d="M176,240 L351,240" fill="none" stroke="#ff4b91" stroke-width="14"/></g><circle cx="246" cy="218" r="5" fill="#73e2bf"/><text x="255" y="209" font-size="15" fill="#edf3ff" font-weight="400" >ID 1</text><defs><clipPath id="cell-2"><polygon points="329.60,181.00 486.00,181.00 486.00,312.64 376.31,349.66 287.71,300.96"/></clipPath></defs><polygon points="329.60,181.00 486.00,181.00 486.00,312.64 376.31,349.66 287.71,300.96" fill="#173346" stroke="#73e2bf" stroke-width="1.5"/><g clip-path="url(#cell-2)"><circle cx="372" cy="262" r="94" fill="url(#haze)"/><path d="M302,284 L477,284" fill="none" stroke="#ff4b91" stroke-width="14"/></g><circle cx="372" cy="262" r="5" fill="#73e2bf"/><text x="381" y="253" font-size="15" fill="#edf3ff" font-weight="400" >ID 2</text><defs><clipPath id="cell-3"><polygon points="222.25,488.00 36.00,488.00 36.00,343.43 193.38,302.71 224.43,320.49"/></clipPath></defs><polygon points="222.25,488.00 36.00,488.00 36.00,343.43 193.38,302.71 224.43,320.49" fill="#153d42" stroke="#73e2bf" stroke-width="1.5"/><g clip-path="url(#cell-3)"><circle cx="147" cy="391" r="94" fill="url(#haze)"/><path d="M77,413 L252,413" fill="none" stroke="#ff4b91" stroke-width="14"/></g><circle cx="147" cy="391" r="5" fill="#73e2bf"/><text x="156" y="382" font-size="15" fill="#edf3ff" font-weight="400" >ID 3</text><defs><clipPath id="cell-4"><polygon points="344.47,488.00 222.25,488.00 224.43,320.49 287.71,300.96 376.31,349.66"/></clipPath></defs><polygon points="344.47,488.00 222.25,488.00 224.43,320.49 287.71,300.96 376.31,349.66" fill="#2d2447" stroke="#73e2bf" stroke-width="1.5"/><g clip-path="url(#cell-4)"><circle cx="300" cy="393" r="94" fill="url(#haze)"/><path d="M230,415 L405,415" fill="none" stroke="#ff4b91" stroke-width="14"/></g><circle cx="300" cy="393" r="5" fill="#73e2bf"/><text x="309" y="384" font-size="15" fill="#edf3ff" font-weight="400" >ID 4</text><defs><clipPath id="cell-5"><polygon points="486.00,312.64 486.00,488.00 344.47,488.00 376.31,349.66"/></clipPath></defs><polygon points="486.00,312.64 486.00,488.00 344.47,488.00 376.31,349.66" fill="#173346" stroke="#73e2bf" stroke-width="1.5"/><g clip-path="url(#cell-5)"><circle cx="426" cy="422" r="94" fill="url(#haze)"/><path d="M356,444 L531,444" fill="none" stroke="#ff4b91" stroke-width="14"/></g><circle cx="426" cy="422" r="5" fill="#73e2bf"/><text x="435" y="413" font-size="15" fill="#edf3ff" font-weight="400" >ID 5</text><text x="36" y="524" font-size="20" fill="#adbad0" font-weight="400" >Motifs clip at the ownership boundary.</text><text x="560" y="161" font-size="22" fill="#ff4b91" font-weight="650" >Scatter: instances can overlap</text><circle cx="670" cy="240" r="58" fill="#ff4b91" fill-opacity=".35" stroke="#ff4b91"/><circle cx="747" cy="264" r="58" fill="#ff4b91" fill-opacity=".35" stroke="#ff4b91"/><circle cx="824" cy="231" r="58" fill="#ff4b91" fill-opacity=".35" stroke="#ff4b91"/><text x="560" y="354" font-size="22" fill="#63caff" font-weight="650" >One pixel, multiple ownership queries</text><rect x="572" y="379" width="136" height="136" rx="0" fill="#163d43" stroke="#73e2bf" /><path d="M625 379 H708 V515 H675 Z" fill="#5d487d" stroke="#5d487d" stroke-width="0" /><circle cx="589" cy="396" r="4" fill="#edf3ff"/><circle cx="623" cy="396" r="4" fill="#edf3ff"/><circle cx="657" cy="396" r="4" fill="#edf3ff"/><circle cx="691" cy="396" r="4" fill="#edf3ff"/><circle cx="589" cy="430" r="4" fill="#edf3ff"/><circle cx="623" cy="430" r="4" fill="#edf3ff"/><circle cx="657" cy="430" r="4" fill="#edf3ff"/><circle cx="691" cy="430" r="4" fill="#edf3ff"/><circle cx="589" cy="464" r="4" fill="#edf3ff"/><circle cx="623" cy="464" r="4" fill="#edf3ff"/><circle cx="657" cy="464" r="4" fill="#edf3ff"/><circle cx="691" cy="464" r="4" fill="#edf3ff"/><circle cx="589" cy="498" r="4" fill="#edf3ff"/><circle cx="623" cy="498" r="4" fill="#edf3ff"/><circle cx="657" cy="498" r="4" fill="#edf3ff"/><circle cx="691" cy="498" r="4" fill="#edf3ff"/><text x="735" y="410" font-size="20" fill="#63caff" font-weight="400" >Map → owner → body</text><text x="735" y="442" font-size="18" fill="#adbad0" font-weight="400" >Repeat for each subsample.</text><text x="735" y="474" font-size="18" fill="#adbad0" font-weight="400" >Combine alpha-weighted colors.</text><text x="735" y="506" font-size="17" fill="#ffc875" font-weight="400" >Finite grids can miss tiny details.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
