="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><text x="511" y="306" font-size="20" fill="#63caff" font-weight="400" >polar</text><circle cx="837" cy="330" r="40" fill="none" stroke="#293c56"/><circle cx="837" cy="330" r="80" fill="none" stroke="#293c56"/><circle cx="837" cy="330" r="120" fill="none" stroke="#293c56"/><circle cx="837" cy="330" r="160" fill="none" stroke="#293c56"/><path d="M837,330 L997.0,330.0" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L975.5640646055102,410.0" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L917.0,468.56406460551017" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L837.0,490.0" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L757.0,468.5640646055102" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L698.4359353944898,410.0" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L677.0,330.0" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L698.4359353944898,250.00000000000006" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L756.9999999999999,191.43593539448983" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L837.0,170.0" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L917.0,191.43593539448983" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L975.5640646055101,249.99999999999994" fill="none" stroke="#293c56" stroke-width="1"/><path d="M837,330 L997,330" fill="none" stroke="#73e2bf" stroke-width="2"/><path d="M837,330 L837,490" fill="none" stroke="#ff4b91" stroke-width="2"/><circle cx="837" cy="330" r="112" fill="none" stroke="#34445a" stroke-width="20"/><circle id="polar-arc" cx="837" cy="330" r="112" fill="none" stroke="#63caff" stroke-width="20" stroke-dasharray="506.68 703.72" transform="rotate(-90 837 330)"/><circle id="polar-endpoint" cx="726.98" cy="350.99" r="5" fill="#ffc875"/><text x="700" y="162" font-size="22" fill="#ff4b91" font-weight="650" >Mapped picture</text><text x="837" y="336" font-size="28" fill="#edf3ff" font-weight="650" id="polar-value" text-anchor="middle">72%</text><text x="709" y="528" font-size="20" fill="#adbad0" font-weight="400" >Same track. Same progress.</text><circle id="polar-point" cx="349" cy="313" r="5" fill="#ffc875"/><text id="polar-point-label" x="349" y="287" font-size="16" fill="#ffc875" font-weight="400" text-anchor="middle">0.72</text>
