<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="945" viewBox="0 0 1120 945" role="img" aria-labelledby="title description">
    <title id="title">Dependencies determine when work can run</title><desc id="description">Fur settings feed density compute, which feeds forward base shading and transparent shells. Prepared fur geometry feeds shell vertex compute. Complete opaque rendering precedes Toon, then the global transparency queue, then inspection and presentation. Density and vertex preparation have no edge between them. Other inputs are omitted.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="945" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >Dependencies determine when work can run</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Preparation branches meet at their consumers; extra draws join explicit engine boundaries.</text>
    <rect x="36" y="153" width="246" height="101" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="153" width="4" height="101" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="56" y="187" font-size="22" fill="#ffc875" font-weight="650" >Fur settings</text><text x="56" y="220" font-size="18" fill="#adbad0" font-weight="400" >Seed + density resolution</text><rect x="354" y="153" width="248" height="101" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="354" y="153" width="4" height="101" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="374" y="187" font-size="22" fill="#ffc875" font-weight="650" >Density compute</text><text x="374" y="220" font-size="18" fill="#adbad0" font-weight="400" >Owned texture</text><rect x="718" y="153" width="366" height="101" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="718" y="153" width="4" height="101" rx="2" fill="#ff4b91" stroke="#ff4b91" /><text x="738" y="187" font-size="22" fill="#ff4b91" font-weight="650" >Fur base shading</text><text x="738" y="220" font-size="18" fill="#adbad0" font-weight="400" >Reads density + lighting inputs</text><rect x="36" y="314" width="246" height="105" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="314" width="4" height="105" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="56" y="348" font-size="22" fill="#73e2bf" font-weight="650" >Prepared fur mesh</text><text x="56" y="381" font-size="18" fill="#adbad0" font-weight="400" >Deformed material range</text><rect x="354" y="314" width="248" height="105" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="354" y="314" width="4" height="105" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="374" y="348" font-size="22" fill="#73e2bf" font-weight="650" >Shell vertex compute</text><text x="374" y="381" font-size="18" fill="#adbad0" font-weight="400" >Generated stream + settings</text><rect x="718" y="314" width="366" height="105" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="718" y="314" width="4" height="105" rx="2" fill="#63caff" stroke="#63caff" /><text x="738" y="348" font-size="22" fill="#63caff" font-weight="650" >Complete opaque</text><text x="738" y="381" font-size="18" fill="#adbad0" font-weight="400" >All opaque depth + lighting</text><rect x="718" y="471" width="366" height="85" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="718" y="471" width="4" height="85" rx="2" fill="#ff4b91" stroke="#ff4b91" /><text x="738" y="505" font-size="22" fill="#ff4b91" font-weight="650" >Toon outline draws</text><text x="738" y="538" font-size="18" fill="#adbad0" font-weight="400" >Selected material ranges</text><rect x="354" y="607" width="730" height="101" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="354" y="607" width="4" height="101" rx="2" fill="#ffc875" stroke="#ffc875" /><text x="374" y="641" font-size="22" fill="#ffc875" font-weight="650" >Global transparency queue</text><text x="374" y="674" font-size="18" fill="#adbad0" font-weight="400" >Fur shells + ordinary transparent draws in one order</text><rect x="718" y="759" width="366" height="78" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="718" y="759" width="4" height="78" rx="2" fill="#63caff" stroke="#63caff" /><text x="738" y="793" font-size="22" fill="#63caff" font-weight="650" >Inspect / present</text><path d="M282,203 L348,203" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M602,203 L712,203" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M282,366 L348,366" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M901,254 L901,308" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M901,419 L901,465" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M901,556 L901,601" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M901,708 L901,753" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><path d="M478 254 V284 H656 V579 H590 V601" fill="none" stroke="#ffc875" stroke-width="2" marker-end="url(#arrow)"/><path d="M478 419 V601" fill="none" stroke="#73e2bf" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="482" font-size="18" fill="#edf3ff" font-weight="650" >Preparation follows its inputs.</text><text x="36" y="513" font-size="18" fill="#adbad0" font-weight="400" >It need not wait for opaque.</text><text x="36" y="771" font-size="18" fill="#adbad0" font-weight="400" >Edges show required dependencies,</text><text x="36" y="800" font-size="18" fill="#adbad0" font-weight="400" >not durations or GPU overlap.</text><text x="36" y="874" font-size="19" fill="#adbad0" font-weight="400" >Forward-path sketch; only key edges shown. Lighting and view resources are also required.</text>
    <path d="M36,902 L1084,902" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="926" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="926" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
