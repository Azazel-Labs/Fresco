<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">What does an effect sample?</title><desc id="description">Chromatic split combines red from a left sample, green at the current sample, and blue from a right sample. An eligible shape-fill-blur pattern can instead use an analytic soften rewrite. The diagram makes no universal pass-count or timing claim.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >What does an effect sample?</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Sampled evaluation and analytic rewrites have different execution costs.</text>
    <rect x="36" y="155" width="494" height="351" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="155" width="4" height="351" rx="2" fill="#63caff" stroke="#63caff" /><text x="56" y="189" font-size="22" fill="#63caff" font-weight="650" >A sampled effect</text><text x="56" y="222" font-size="18" fill="#adbad0" font-weight="400" >Chromatic split reads one layer</text><text x="56" y="249" font-size="18" fill="#adbad0" font-weight="400" >at three coordinate locations.</text><circle cx="126" cy="310" r="15" fill="#ff4b91"/><text x="126" y="349" font-size="18" fill="#ff4b91" font-weight="400" text-anchor="middle">left.r</text><path d="M126,367 L276,414" fill="none" stroke="#ff4b91" stroke-width="2" marker-end="url(#arrow)"/><circle cx="276" cy="310" r="15" fill="#73e2bf"/><text x="276" y="349" font-size="18" fill="#73e2bf" font-weight="400" text-anchor="middle">self.g</text><path d="M276,367 L276,414" fill="none" stroke="#73e2bf" stroke-width="2" marker-end="url(#arrow)"/><circle cx="426" cy="310" r="15" fill="#63caff"/><text x="426" y="349" font-size="18" fill="#63caff" font-weight="400" text-anchor="middle">right.b</text><path d="M426,367 L276,414" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="422" width="112" height="44" rx="8" fill="#dcc0ef" stroke="none" /><text x="276" y="451" font-size="19" fill="#152039" font-weight="650" text-anchor="middle">RGBA</text><rect x="570" y="155" width="514" height="351" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="570" y="155" width="4" height="351" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="590" y="189" font-size="22" fill="#73e2bf" font-weight="650" >A recognized analytic rewrite</text><text x="590" y="222" font-size="18" fill="#adbad0" font-weight="400" >shape → fill → blur</text><text x="590" y="249" font-size="18" fill="#adbad0" font-weight="400" >Eligible pattern → analytic soften</text><circle cx="710" cy="365" r="87" fill="url(#haze)"/><circle cx="928" cy="365" r="32" fill="none" stroke="#73e2bf" stroke-opacity="0.71"/><circle cx="928" cy="365" r="48" fill="none" stroke="#73e2bf" stroke-opacity="0.56"/><circle cx="928" cy="365" r="64" fill="none" stroke="#73e2bf" stroke-opacity="0.42"/><circle cx="928" cy="365" r="80" fill="none" stroke="#73e2bf" stroke-opacity="0.27"/><path d="M808,365 L838,365" fill="none" stroke="#63caff" stroke-width="2" marker-end="url(#arrow)"/><text x="598" y="476" font-size="18" fill="#adbad0" font-weight="400" >Use --explain to inspect the selected rewrite.</text><text x="36" y="550" font-size="21" fill="#edf3ff" font-weight="400" >More samples can mean more work. An effect does not automatically imply another GPU pass.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
