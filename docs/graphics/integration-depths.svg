<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
    <title id="title">Three ways to bring Fresco into an engine</title><desc id="description">Canvas integration produces a picture in a target. Material integration connects surface logic to engine lighting. Rendering contributions additionally connect compute and draws to engine capabilities and ordering.</desc>
    <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#63caff" stroke-width="1.5"/></marker>
    <linearGradient id="paint"><stop stop-color="#ff4b91"/><stop offset=".5" stop-color="#a68dff"/><stop offset="1" stop-color="#63caff"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%"><stop stop-color="#ffe3ad"/><stop offset=".55" stop-color="#f7a370"/><stop offset="1" stop-color="#703352"/></radialGradient>
    <radialGradient id="haze"><stop stop-color="#ffc875" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9975" stop-opacity=".4"/><stop offset="1" stop-color="#ff9975" stop-opacity="0"/></radialGradient>
    </defs><g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1120" height="620" rx="22" fill="#0a1020" stroke="#28364c" />
    <text x="36" y="36" font-size="12" fill="#73e2bf" font-weight="700" >F R E S C O   /   VISUAL LANGUAGE ATLAS</text>
    <text x="36" y="79" font-size="32" fill="#edf3ff" font-weight="700" >Three ways to bring Fresco into an engine</text>
    <text x="36" y="111" font-size="18" fill="#adbad0" font-weight="400" >Each route has a visible payoff and a concrete host responsibility.</text>
    <rect x="36" y="155" width="328" height="365" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="36" y="155" width="4" height="365" rx="2" fill="#63caff" stroke="#63caff" /><text x="56" y="189" font-size="22" fill="#63caff" font-weight="650" >Canvas</text><text x="56" y="416" font-size="18" fill="#adbad0" font-weight="400" >Render a procedural picture</text><text x="56" y="444" font-size="18" fill="#adbad0" font-weight="400" >to an engine-owned target.</text><rect x="396" y="155" width="328" height="365" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="396" y="155" width="4" height="365" rx="2" fill="#ff4b91" stroke="#ff4b91" /><text x="416" y="189" font-size="22" fill="#ff4b91" font-weight="650" >Materials</text><text x="416" y="416" font-size="18" fill="#adbad0" font-weight="400" >Connect surface evaluation</text><text x="416" y="444" font-size="18" fill="#adbad0" font-weight="400" >to your lighting path.</text><rect x="756" y="155" width="328" height="365" rx="16" fill="#131f33" stroke="#2b3c55" /><rect x="756" y="155" width="4" height="365" rx="2" fill="#73e2bf" stroke="#73e2bf" /><text x="776" y="189" font-size="22" fill="#73e2bf" font-weight="650" >Rendering contributions</text><text x="776" y="416" font-size="18" fill="#adbad0" font-weight="400" >Expose capabilities + boundaries</text><text x="776" y="444" font-size="18" fill="#adbad0" font-weight="400" >for compute and extra draws.</text><circle cx="200" cy="290" r="74" fill="none" stroke="#283d58" stroke-width="18"/><circle cx="200" cy="290" r="74" fill="none" stroke="#63caff" stroke-width="18" stroke-dasharray="335 465" transform="rotate(-90 200 290)"/><text x="200" y="299" font-size="28" fill="#63caff" font-weight="650" text-anchor="middle">72%</text><circle cx="560" cy="290" r="80" fill="url(#orb)"/><circle cx="920" cy="290" r="87" fill="#ff4b91"/><circle cx="920" cy="290" r="78" fill="url(#orb)"/><text x="36" y="555" font-size="20" fill="#edf3ff" font-weight="400" >Choose an integration depth; deeper access requires a richer engine contract.</text>
    <path d="M36,577 L1084,577" fill="none" stroke="#28364c" stroke-width="1"/>
    <text x="36" y="601" font-size="12" fill="#adbad0" font-weight="400" >GEOMETRY / mint     PAINT / pink     COORDINATES + FLOW / blue     RESOURCES / amber</text>
    <text x="1084" y="601" font-size="11" fill="#adbad0" font-weight="400" text-anchor="end">CONCEPTUAL DIAGRAM</text>
    </g></svg>
